[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchday-sqlite"
version = "0.1.0"
description = "Rehearse SQLite migrations on an isolated snapshot before touching a live database."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Miiduoa"}]
dependencies = []

[project.scripts]
patchday = "patchday.cli:main"

[tool.setuptools.packages.find]
include = ["patchday*"]
