name: Chinook case study
on: workflow_dispatch
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python experiments/chinook/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinook-evidence
          path: work/chinook/
